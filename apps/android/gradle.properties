# ─────────────────────────────────────────────────────────────────────────────
# Bank of the Family — Android Trusted Web Activity configuration
#
# This is the ONE place to point the app at your deployment. Everything else
# (AndroidManifest.xml intent filter, digital asset links string, application id,
# theme colors) is wired from these values in app/build.gradle — you should not
# need to edit any other file to rebrand or repoint this app.
#
# See docs/android-build.md for the full build + signing walkthrough.
# ─────────────────────────────────────────────────────────────────────────────

# The public hostname your server is reachable at (no scheme, no trailing slash).
# Must match APP_URL in deploy/.env (minus the "https://") and must serve
# /.well-known/assetlinks.json (see apps/api ANDROID_PACKAGE_NAME / APP_ASSETLINKS_FINGERPRINTS).
twaHost=bank.example.com

# Android application ID. Must be a valid Java package name and must match
# ANDROID_PACKAGE_NAME in deploy/.env / apps/api/.env so the server's
# assetlinks.json names this exact package.
twaPackage=family.bank.app

# Display name shown under the launcher icon and in the launched app.
twaName=Bank of the Family
twaLauncherName=Family Bank

# Path (relative to https://twaHost/) opened when the app launches.
twaLaunchUrl=/

# Colors (must be #RRGGBB). Match apps/web/vite.config.ts manifest theme/background.
twaThemeColor=#0b1f3a
twaBackgroundColor=#0b1f3a
twaStatusBarColor=#0b1f3a
twaNavigationBarColor=#0b1f3a
twaNavigationBarDividerColor=#0b1f3a
twaSplashBackgroundColor=#0b1f3a

# App version. Bump twaVersionCode (integer, must increase) on every release you
# upload to a store or push as an update; twaVersionName is the human-readable one.
twaVersionCode=1
twaVersionName=1.0.0

# "standalone" hides the browser UI entirely (recommended). "fullscreen" also hides
# the status bar.
twaDisplayMode=standalone
twaOrientation=portrait

# What to show if Chrome / an installable WebView provider is missing (rare):
# "customtabs" opens a Chrome Custom Tab instead of failing outright.
twaFallbackType=customtabs

# Enable Google Play Billing passthrough for digital goods. Not used by this app.
twaEnableSiteSettingsShortcut=true

# ── Standard Gradle / AGP settings ────────────────────────────────────────────
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
