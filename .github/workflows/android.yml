name: Android

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/android/**"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Generate Gradle wrapper (jar isn't committed to the repo)
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.10.2
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/android/**/*.gradle*', 'apps/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
        # No secrets needed: the debug build type is self-signed with Android's throwaway debug
        # keystore. This job is a compile check + convenience artifact, not a release build — see
        # docs/android-build.md for producing a signed release.

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
